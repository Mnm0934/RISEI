<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>購入手続き | 履正社高校硬式野球部OB会</title>

<style>

:root{
    --main:#00b7c7;
    --navy:#003a63;
    --gray:#f5f7fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:var(--gray);
    color:#222;
}

.container{
    width:90%;
    max-width:800px;
    margin:auto;
}

header{
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-inner{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.4rem;
    font-weight:bold;
    color:var(--navy);
}

.logo span{
    display:block;
    color:var(--main);
    font-size:12px;
}

.back-btn{
    background:var(--main);
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
    text-decoration:none;
}

.checkout{
    padding:60px 0;
}

.form-box{
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.form-box h1{
    color:var(--navy);
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    height:120px;
    resize:none;
}

.submit-btn{
    width:100%;
    background:var(--main);
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    opacity:0.9;
}

footer{
    background:#061826;
    color:#fff;
    text-align:center;
    padding:40px 20px;
    margin-top:60px;
}

</style>
</head>
<body>

<header>

<div class="container header-inner">

<div class="logo">
履正社高校硬式野球部OB会
<span>RISEI SHOP 特設サイト</span>
</div>

<a href="cart.html" class="back-btn">
カートへ戻る
</a>

</div>

</header>

<section class="checkout">

<div class="container">

<div class="form-box">

<h1>購入手続き</h1>

<div style="
background:#f5f7fa;
padding:20px;
border-radius:10px;
margin-bottom:30px;
">

<h3>ご注文内容</h3>

<div id="order-summary">

</div>

</div>

<iframe
name="hidden_iframe"
style="display:none;">
</iframe>

<form
action="<a href="https://docs.google.com/forms/d/e/1FAIpQLScj1vmMtXvUfwpWAsZWUplBCTbBkNx_mDhT-YWEdYLFTi4LGg/formResponse"
method="POST"
target="_blank">


<div class="form-group">
<label>お名前</label>
<input
type="text"
name="entry.1579585681"
placeholder="例：履正社 太郎"
required
>
</div>

<div class="form-group">
<label>フリガナ</label>
<input
type="text"
name="entry.954214947"
placeholder="リセイシャ タロウ"
required
>
</div>

<div class="form-group">
<label>メールアドレス</label>
<input
type="email"
name="entry.731522066"
placeholder="example@email.com"
required
>
</div>

<div class="form-group">
<label>電話番号</label>
<input
type="tel"
name="entry.1827567744"
placeholder="09012345678"
required
>
</div>

<div class="form-group">
<label>郵便番号</label>
<input
type="text"
name="entry.742542028"
placeholder="123-4567"
required
>
</div>

<div class="form-group">
<label>住所</label>
<input
type="text"
name="entry.145627215"
placeholder="大阪府○○市○○町1-2-3"
required
>
</div>

<input
type="hidden"
id="orderData"
name="entry.759961625">


<div class="form-group">

<label>お支払い方法</label>

<input
type="text"
value="銀行振込のみ"
readonly
>

</div>


<div class="form-group">
<label>備考</label>
<textarea
name="entry.171466214"
></textarea>
</div>

<div style="
background:#fff8e1;
border:1px solid #ffd54f;
padding:15px;
border-radius:10px;
margin-bottom:20px;
">

<strong>お支払いについて</strong><br>

ご注文後、運営より振込先をご案内いたします。<br>
入金確認後に商品の発送手続きを行います。

</div>

<button type="submit" class="submit-btn">
注文を確定する
</button>

</form>

</div>

</div>

</section>

<footer>

<p>
© 2026 履正社高校硬式野球部OB会
<br>
甲子園出場記念Tシャツ販売特設サイト
</p>

<p>
<a href="index.html">TOPへ戻る</a>
</p>

</footer>

<script>

const cartData =
JSON.parse(
localStorage.getItem("riseiCart")
) || [];

let orderText = '';

let html = '';

let total = 0;

cartData.forEach(item => {

    const subtotal =
    item.price * item.quantity;

    total += subtotal;

    html += `
    <p>

    ${item.product}<br>

    サイズ：${item.size}<br>

    数量：${item.quantity}<br>

    小計：¥${subtotal.toLocaleString()}

    </p>

    <hr>
    `;

    orderText +=
`${item.product}
サイズ:${item.size}
数量:${item.quantity}

`;

});

html += `
<h3>
合計金額：¥${total.toLocaleString()}
</h3>
`;

document.getElementById(
    "order-summary"
).innerHTML = html;

document.getElementById(
    "orderData"
).value = orderText;

document
.getElementById("orderForm")
.addEventListener("submit", function(){

    setTimeout(function(){

        window.location.href =
        "thanks.html";

    }, 1000);

});

</script>

</body>
</html>
