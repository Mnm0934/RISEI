<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品詳細 | 履正社高校硬式野球部OB会</title>

<style>

:root{
    --main:#00b7c7;
    --navy:#003a63;
    --gray:#f5f7fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#f5f7fa;
    color:#222;
}

a{
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

header{
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-inner{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.4rem;
    font-weight:bold;
    color:var(--navy);
}

.logo span{
    display:block;
    font-size:12px;
    color:var(--main);
    letter-spacing:2px;
}

.cart-btn{
    background:var(--main);
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
}

/* DETAIL */

.detail{
    padding:80px 0;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
}

.detail-image img{
    width:100%;
    border-radius:20px;
}

.detail-info h1{
    color:var(--navy);
    margin-bottom:15px;
}

.price{
    color:var(--main);
    font-size:2rem;
    font-weight:bold;
    margin:20px 0;
}

.description{
    margin-bottom:30px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.buy-btn{
    display:block;
    width:100%;
    background:var(--main);
    color:white;
    padding:16px;
    border-radius:12px;
    border:none;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.buy-btn:hover{
    opacity:.9;
}

/* FOOTER */

footer{
    background:#061826;
    color:white;
    text-align:center;
    padding:40px 20px;
}

@media(max-width:768px){

.detail-grid{
    grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<header>

<div class="container header-inner">

<div class="logo">
履正社高校硬式野球部OB会
<span>RISEI SHOP</span>
</div>

<a href="cart.html" class="cart-btn">
🛒 カート
</a>

</div>

</header>

<section class="detail">

<div class="container">

<div class="detail-grid">

<div class="detail-image">
<img src="tshirt.jpeg" alt="甲子園出場記念Tシャツ">
</div>

<div class="detail-info">

<h1>
履正社高校硬式野球部OB会<br>
甲子園出場記念Tシャツ
</h1>

<div class="price">
¥3,500
</div>

<div class="description">

<p>
甲子園出場を記念した限定デザインTシャツです。
</p>

<br>

<p>
売上の一部は履正社高校硬式野球部への
支援活動に活用されます。
</p>

</div>

<form id="cartForm">

<div class="form-group">

<label>
サイズ
</label>

<select name="size" required>

<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>

</select>

</div>

<div class="form-group">

<label>
数量
</label>

<input
type="number"
name="qty"
value="1"
min="1"
max="10"
required
>

</div>

<div class="form-group">

<label>
備考（任意）
</label>

<input
type="text"
name="remark"
placeholder="備考があれば入力"
>

</div>

<button class="buy-btn" type="submit">

カートに入れる

</button>

</form>

</div>

</div>

</div>

</section>

<footer>

<p>
© 2026 履正社高校硬式野球部OB会
甲子園出場記念Tシャツ販売サイト
</p>

<script>

document
.getElementById("cartForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const size =
    document.querySelector(
    'select[name="size"]'
    ).value;

    const quantity =
    document.querySelector(
    'input[name="qty"]'
    ).value;

    const remark =
    document.querySelector(
    'input[name="remark"]'
    ).value;

    const cartData = {

        product:
        "履正社高校硬式野球部OB会 甲子園出場記念Tシャツ",

        price:3500,

        size:size,

        quantity:Number(quantity),

        remark:remark

    };

    localStorage.setItem(
        "riseiCart",
        JSON.stringify(cartData)
    );

    location.href="cart.html";

});

</script>

</footer>

</body>
</html>
