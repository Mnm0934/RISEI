<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>カート | 履正社高校硬式野球部OB会</title>

<style>

:root{
    --main:#00b7c7;
    --navy:#003a63;
    --gray:#f5f7fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:var(--gray);
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

header{
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-inner{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.4rem;
    font-weight:bold;
    color:var(--navy);
}

.logo span{
    display:block;
    font-size:12px;
    color:var(--main);
}

.back-btn{
    background:var(--main);
    color:#fff;
    text-decoration:none;
    padding:10px 20px;
    border-radius:30px;
}

.page-title{
    text-align:center;
    padding:60px 20px;
}

.page-title h1{
    color:var(--navy);
}

.cart-area{
    background:#fff;
    border-radius:20px;
    padding:30px;
    margin-bottom:40px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.cart-item{
    display:flex;
    gap:30px;
    align-items:center;
}

.cart-item img{
    width:250px;
    border-radius:15px;
}

.item-info h2{
    margin-bottom:10px;
}

.price{
    color:var(--main);
    font-size:2rem;
    font-weight:bold;
}

.row{
    margin-top:10px;
}

.total{
    text-align:right;
    font-size:2rem;
    font-weight:bold;
    color:var(--navy);
    margin-top:30px;
}

.checkout-btn{
    display:block;
    width:100%;
    background:var(--main);
    color:#fff;
    text-align:center;
    padding:18px;
    margin-top:30px;
    text-decoration:none;
    border-radius:12px;
    font-size:1.1rem;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:80px 20px;
}

footer{
    background:#061826;
    color:white;
    text-align:center;
    padding:40px;
}

@media(max-width:768px){

.cart-item{
    flex-direction:column;
}

.cart-item img{
    width:100%;
}

.total{
    text-align:center;
}

}

</style>
</head>
<body>

<header>

<div class="container header-inner">

<div class="logo">
履正社高校硬式野球部OB会
<span>RISEI SHOP 特設サイト</span>
</div>

<a href="products.html" class="back-btn">
商品へ戻る
</a>

</div>

</header>

<section class="page-title">

<h1>ショッピングカート</h1>

</section>

<div class="container">

<div id="cart-container">

</div>

</div>

<footer>

<p>
© 2026 履正社高校硬式野球部OB会
</p>

</footer>

<script>

const cartData = JSON.parse(
localStorage.getItem("riseiCart")
);

const cartContainer =
document.getElementById("cart-container");

if(!cartData){

cartContainer.innerHTML = `

<div class="empty">

<h2>カートは空です</h2>

<br>

<a href="products.html">
商品一覧へ戻る
</a>

</div>

`;

}else{

const total =
3500 * cartData.quantity;

cartContainer.innerHTML = `

<div class="cart-area">

<div class="cart-item">

<img src="tshirt.jpeg" alt="甲子園出場記念Tシャツ">

<div class="item-info">

<h2>
履正社高校硬式野球部OB会
甲子園出場記念Tシャツ
</h2>

<div class="row">
サイズ：
${cartData.size}
</div>

<div class="row">
数量：
${cartData.quantity}
</div>

<div class="price">
¥3,500
</div>

</div>

</div>

<div class="total">

合計金額
¥${total.toLocaleString()}

</div>

<a href="checkout.html"
class="checkout-btn">

購入手続きへ進む

</a>

</div>

`;

}

</script>

</body>
</html>
